name: Dependency review

# Blocks a pull request that introduces a dependency with a known
# vulnerability, or that swaps in one under a license we cannot ship.
on: [pull_request]

permissions:
  contents: read

jobs:
  review:
    name: Review dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          # Beagle is Apache-2.0. A copyleft dependency would force a
          # relicense, so it fails the PR rather than being noticed at release.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-3.0
