name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the in-flight run irrelevant. Keep main serialized.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: swift format lint --recursive --strict Sources Tests

      - name: Check shell scripts
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          shellcheck Scripts/*.sh

  build:
    name: Build & test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # FluidAudio pulls a prebuilt xcframework and compiles ~250 files; without
      # a cache every run pays ~3 minutes for dependencies that rarely change.
      #
      # The repository name is part of the key because `.build` stores absolute
      # paths: a cache saved under `work/murmur/murmur` restored into
      # `work/hugo/hugo` makes clang reject every precompiled header with
      # "PCH was compiled with module cache path ...". Renaming the repo broke
      # exactly this, so the key has to change with the checkout path.
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-${{ github.repository }}-

      - name: Build
        run: swift build --configuration release

      - name: Test
        run: swift test --parallel
